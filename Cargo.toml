[package]
name = "h"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.41.1", features = ["_api", "model", "responses", "image"] }
async-trait = "0.1.91"
crossterm = "0.29.0"
futures = "0.3.33"
iocraft = "0.8.4"
parking_lot = "0.12.5"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
run = "0.5.2"
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shellexpand = "3.1.2"
textwrap = "0.16.2"
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
uuid = { version = "1.24.0", features = ["v4", "v7", "fast-rng"] }

