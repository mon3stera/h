[package]
name = "h"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.41.1", features = ["_api", "model", "responses", "image", "byot"] }
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.3", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dashmap = "6.2.1"
expectrl = { version = "0.9.0", features = ["async"] }
futures = "0.3.33"
fuzzy_match_flex = "0.1.2"
gix = "0.86.0"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.31"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
readabilityrs = "0.1.3"
reqwest = { version = "0.12.4", features = ["json"] }
run = "0.5.2"
schemars = "1.2.1"
scopeguard = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shellexpand = "3.1.2"
similar = "3.1.1"
strip-ansi-escapes = "0.2.1"
strsim = "0.11.1"
textwrap = "0.16.2"
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
uuid = { version = "1.24.0", features = ["v4", "v7", "fast-rng"] }

[dev-dependencies]
# `start_paused` runs the backoff tests on virtual time instead of sleeping.
tokio = { version = "1.53.0", features = ["test-util"] }

