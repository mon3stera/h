[workspace]
members = ["crates/h-core", "crates/h-tui"]
exclude = ["forks/async-openai"]
default-members = [".", "crates/h-core", "crates/h-tui"]
resolver = "2"

[package]
name = "h"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.3", features = ["derive"] }
h-core = { path = "crates/h-core" }
h-tui = { path = "crates/h-tui" }
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[patch.crates-io]
async-openai = { path = "forks/async-openai" }
