[package]
name = "h-memory"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
blake3 = "1.8.3"
chrono = { version = "0.4.45", features = ["serde"] }
gix = "0.86.0"
h-core = { path = "../h-core" }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
shellexpand = "3.1.2"
tokio = { version = "1.53.0", features = ["fs", "rt", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3.27.0"
